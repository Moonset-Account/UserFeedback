<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>WARC 研究资料字段提取工具</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">▦</span>
      <div>
        <h1>WARC 研究资料字段提取工具</h1>
        <p class="subtitle">本地归档 · 字段与归档来源对应卡片 · 支持 revisit 明确引用还原</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="run-demo" class="btn btn-primary" type="button">▶ 运行示例（正常 + 边界）</button>
      <button id="run-acceptance" class="btn btn-secondary" type="button">完整验收场景</button>
    </div>
  </header>

  <section class="config-panel">
    <div class="config-left">
      <h2>1. 配置输入</h2>
      <form id="upload-form">
        <label class="file-picker">
          <input type="file" id="warc-file" accept=".warc,.warc.gz,.gz">
          <span id="file-label">选择本地 .warc / .warc.gz 样例归档（≤ 50MB）</span>
        </label>
        <button id="upload-btn" class="btn btn-primary" type="submit" disabled>上传并运行提取</button>
      </form>
      <p class="hint">上传文件仅在本地处理：提取在隔离解释器子进程中进行，不联网、不提供归档管理功能。</p>
    </div>
    <div class="config-right">
      <h2>2. 任务队列</h2>
      <div id="job-list" class="job-list">
        <p class="empty-hint">暂无任务。点击「运行示例」或上传归档开始。</p>
      </div>
    </div>
  </section>

  <section class="result-panel">
    <div class="result-head">
      <h2>3. 提取结果（字段 ↔ 归档来源）</h2>
      <div id="result-meta" class="result-meta"></div>
    </div>
    <div id="status-banner" class="status-banner hidden"></div>
    <div id="cards" class="cards"></div>
  </section>

  <footer class="footer">
    <span>虚构数据演示 · 支持 WARC 1.0/1.1（response / request / revisit，多成员 gzip）· 解析库 warcio 1.7.4</span>
  </footer>
</div>

<!-- 原始响应取证抽屉 -->
<div id="drawer-mask" class="drawer-mask hidden"></div>
<aside id="raw-drawer" class="raw-drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3>原始响应取证</h3>
    <button id="drawer-close" class="btn btn-ghost" type="button">关闭 ✕</button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
