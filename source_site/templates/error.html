<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ title }} · 虚构源站</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='source.css') }}">
</head>
<body>
<header class="site-header"><div class="brand">🧪 虚构实验数据公开源站</div><nav><a href="/">实验索引</a></nav></header>
<main class="container">
  <!-- 错误页：error_html 场景下 HTTP 状态码为 200，采集器需依据内容类型识别 -->
  <section class="error-page" data-error-kind="{{ kind or 'error' }}">
    <h1>{{ title }}</h1>
    <p class="error-code">业务状态码：{{ code }}</p>
    <p>{{ message }}</p>
    <p class="hint">请返回实验页面重新获取导出地址。</p>
  </section>
</main>
</body>
</html>
